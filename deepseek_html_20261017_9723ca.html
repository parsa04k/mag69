<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجله صنایع</title>
    
    <!-- اضافه کردن فونت فارسی (اختیاری) -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

    <!-- کتابخانه PDF.js برای خواندن فایل PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <!-- کتابخانه StPageFlip برای افکت ورق زدن -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Vazirmatn', sans-serif;
            overflow: hidden; /* جلوگیری از اسکرول اضافه */
        }

        #flipbook-container {
            /* سایز کلی کتاب */
            width: 1000px; 
            height: 700px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background-color: #fff;
            /* در حالت موبایل سایز تغییر میکند (با جاوا اسکریپت مدیریت می‌شود) */
        }

        /* استایل صفحات */
        .page {
            background-color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* جلوگیری از کشیده شدن عکس */
        }

        #loading {
            color: white;
            font-size: 24px;
            position: absolute;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="loading">در حال بارگذاری مجله...</div>
    <div id="flipbook-container"></div>

    <script>
        // مسیر فایل PDF
        const pdfUrl = 'magazine.pdf'; 

        // تنظیمات PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        async function initFlipbook() {
            try {
                // 1. بارگذاری فایل PDF
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                const pdf = await loadingTask.promise;
                const totalPages = pdf.numPages;
                const container = document.getElementById('flipbook-container');
                
                // حذف متن لودینگ
                document.getElementById('loading').style.display = 'none';

                // 2. حلقه برای خواندن تک تک صفحات و تبدیل به عکس
                for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    
                    // تنظیم کیفیت و سایز رندر شدن
                    const viewport = page.getViewport({ scale: 2.0 });
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    // رندر کردن صفحه روی canvas
                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    // تبدیل canvas به عکس (Base64)
                    const imgDataUrl = canvas.toDataURL('image/jpeg', 0.8);

                    // ساخت المان صفحه برای فلیپ‌بوک
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    
                    const img = document.createElement('img');
                    img.src = imgDataUrl;
                    
                    pageDiv.appendChild(img);
                    container.appendChild(pageDiv);
                }

                // 3. راه‌اندازی کتاب با StPageFlip
                // چون متن فارسی است، حالت RTL را در نظر می‌گیریم (معمولا برای کتاب راست‌چین، صفحه اول کاور است)
                const pageFlip = new St.PageFlip(container, {
                    width: 500, // نصف عرض کانتینر (چون دو صفحه باز میشود)
                    height: 700, // ارتفاع
                    size: "stretch", // واکنش‌گرا بودن
                    minWidth: 300,
                    maxWidth: 1000,
                    minHeight: 400,
                    maxHeight: 1200,
                    drawShadow: true, // افکت سایه
                    showCover: true, // صفحه اول به عنوان کاور در نظر گرفته شود
                    usePortrait: true, // در موبایل تک صفحه‌ای شود
                    flippingTime: 1000, // سرعت ورق زدن (میلی‌ثانیه)
                });

                // لود کردن صفحات
                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                // تنظیمات ریسپانسیو برای تغییر سایز صفحه
                window.addEventListener('resize', () => {
                    pageFlip.update();
                });

            } catch (error) {
                console.error("خطا در بارگذاری PDF: ", error);
                document.getElementById('loading').innerText = "خطا در بارگذاری فایل! لطفا با سرور لوکال اجرا کنید.";
            }
        }

        // اجرای تابع
        initFlipbook();
    </script>
</body>
</html>
