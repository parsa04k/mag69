<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فلیپ‌بوک مجله صنایع</title>
    
    <!-- کتابخانه PDF.js برای خواندن و رندر فایل PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- کتابخانه StPageFlip برای افکت ورق‌زدن -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Tahoma, sans-serif;
            overflow: hidden;
        }

        #loading {
            position: absolute;
            color: #fff;
            font-size: 1.2rem;
            z-index: 100;
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 20px 40px;
            border-radius: 10px;
        }

        .flipbook-wrapper {
            width: 90vw;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* ترفند اصلی برای راست‌چین کردن کل کتاب */
            transform: scaleX(-1);
        }

        #flipbook {
            width: 100%;
            height: 100%;
        }

        .page {
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            /* برگرداندن محتوای هر صفحه به حالت عادی */
            transform: scaleX(-1);
        }

        /* استایل برای بوم (Canvas) رندر شده PDF */
        .page canvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="loading">در حال بارگذاری و پردازش فایل PDF...</div>

    <div class="flipbook-wrapper">
        <div id="flipbook"></div>
    </div>

    <script>
        // تنظیم آدرس Worker برای PDF.js (بسیار مهم برای عملکرد صحیح)
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // آدرس فایل PDF شما (در کنار index.html)
        const pdfUrl = 'magazine.pdf';

        // مقداردهی اولیه StPageFlip
        const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width: 550,          // عرض پایه هر صفحه
            height: 733,         // ارتفاع پایه هر صفحه (نسبت A4)
            size: "stretch",     // کشیده شدن به اندازه کانتینر
            minWidth: 300,
            maxWidth: 1000,
            minHeight: 400,
            maxHeight: 1333,
            maxShadowOpacity: 0.5,
            showCover: true,     // نمایش جلد به صورت تک صفحه
            mobileScrollSupport: false,
            usePortrait: true,   // در موبایل تک صفحه‌ای شود
            autoSize: true,
            showPageCorners: true,
            disableFlipByClick: false,
        });

        // تابع اصلی برای خواندن PDF و ساخت صفحات
        async function loadPdfAsFlipbook() {
            try {
                // بارگذاری فایل PDF
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                const pdf = await loadingTask.promise;
                const totalPages = pdf.numPages;

                // آرایه‌ای برای نگهداری عناصر صفحات
                const pageElements = [];

                // حلقه برای رندر تک‌تک صفحات
                for (let i = 1; i <= totalPages; i++) {
                    const page = await pdf.getPage(i);
                    
                    // تنظیم مقیاس رندر (برای کیفیت مناسب)
                    const viewport = page.getViewport({ scale: 1.5 });
                    
                    // ایجاد بوم (Canvas) برای هر صفحه
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    // رندر صفحه PDF روی بوم
                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    // ایجاد یک عنصر div با کلاس page برای StPageFlip
                    const pageDiv = document.createElement('div');
                    pageDiv.classList.add('page');
                    pageDiv.appendChild(canvas);
                    
                    pageElements.push(pageDiv);
                }

                // بارگذاری صفحات در StPageFlip با استفاده از عناصر HTML
                pageFlip.loadFromHTML(pageElements);

                // مخفی کردن پیام لودینگ
                document.getElementById('loading').style.display = 'none';

            } catch (error) {
                console.error('خطا در بارگذاری PDF:', error);
                document.getElementById('loading').innerText = 'خطا در بارگذاری فایل PDF. لطفاً کنسول مرورگر را بررسی کنید.';
            }
        }

        // شروع فرآیند
        loadPdfAsFlipbook();
    </script>
</body>
</html>
